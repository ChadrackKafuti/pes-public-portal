name: load-gov-upload

# Loads the consolidated CAFI 2025 governance seeds (M17) into gov_areas.
# Idempotent (upsert by src_uid); dispatch again after a seed update.
on:
  workflow_dispatch:

concurrency:
  group: load-gov-upload
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]" shapely
      - name: Load seeds
        env:
          CAFI_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python services/pipeline/scripts/load_gov_upload.py infra/data/gov_upload_2025
