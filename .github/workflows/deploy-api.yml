name: deploy-api

# Deploys services/api to Fly.io. Needs the FLY_API_TOKEN repository secret
# (fly tokens create deploy -a cafi-rs-api).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["services/api/**"]

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        working-directory: services/api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
