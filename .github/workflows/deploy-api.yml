name: deploy-api

# Deploys services/api to Fly.io. Needs the FLY_API_TOKEN repository secret
# (fly tokens create deploy -a cafi-rs-api).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["services/api/**"]

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the app on first run
        run: flyctl apps list --json | grep -q '"cafi-rs-api"' || flyctl apps create cafi-rs-api
      - name: Sync the database secret (staged; applied by the deploy)
        working-directory: services/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: flyctl secrets set --stage "CAFI_DATABASE_URL=$DATABASE_URL"
      - name: Sync the storage service key (staged; skipped until the secret exists)
        working-directory: services/api
        env:
          SERVICE_KEY: ${{ secrets.CAFI_SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SERVICE_KEY" ]; then
            flyctl secrets set --stage "CAFI_SUPABASE_SERVICE_KEY=$SERVICE_KEY"
          else
            echo "CAFI_SUPABASE_SERVICE_KEY not set; photo image URLs stay disabled"
          fi
      - run: flyctl deploy --remote-only
        working-directory: services/api
