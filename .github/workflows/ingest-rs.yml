name: ingest-rs

# Runs the PES RS pipeline (services/pipeline): PES Open API -> parcels ->
# GEE indicators -> the platform database.
#
# Hourly schedule: the API is Supabase-auth-protected (the gate for
# enabling this), and each run continues where the last one's time
# budget stopped, so the first full backlog drains across a few runs.
#
# Secrets: DATABASE_URL, CAFI_RS_PES_API_BASE, CAFI_RS_PES_OIDC_TOKEN_URL,
# CAFI_RS_PES_CLIENT_ID, CAFI_RS_PES_CLIENT_SECRET, CAFI_RS_PES_USERNAME,
# CAFI_RS_PES_PASSWORD, CAFI_RS_GEE_SERVICE_ACCOUNT, CAFI_RS_GEE_KEY_B64.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

concurrency:
  group: ingest-rs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "services/pipeline[compute]"
      - name: Run pipeline once
        env:
          # fill the 30-min job window; the config default (15) is for dev
          CAFI_RS_MAX_RUN_MINUTES: "25"
          CAFI_RS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CAFI_RS_PES_API_BASE: ${{ secrets.CAFI_RS_PES_API_BASE }}
          CAFI_RS_PES_OIDC_TOKEN_URL: ${{ secrets.CAFI_RS_PES_OIDC_TOKEN_URL }}
          CAFI_RS_PES_CLIENT_ID: ${{ secrets.CAFI_RS_PES_CLIENT_ID }}
          CAFI_RS_PES_CLIENT_SECRET: ${{ secrets.CAFI_RS_PES_CLIENT_SECRET }}
          CAFI_RS_PES_USERNAME: ${{ secrets.CAFI_RS_PES_USERNAME }}
          CAFI_RS_PES_PASSWORD: ${{ secrets.CAFI_RS_PES_PASSWORD }}
          CAFI_RS_GEE_SERVICE_ACCOUNT: ${{ secrets.CAFI_RS_GEE_SERVICE_ACCOUNT }}
          CAFI_RS_GEE_KEY_B64: ${{ secrets.CAFI_RS_GEE_KEY_B64 }}
          # Photo mirror (M7a). The project URL is public; the service key
          # gates mirroring — absent, photo rows still sync without images.
          CAFI_RS_ANTHROPIC_API_KEY: ${{ secrets.CAFI_ANTHROPIC_API_KEY }}
          CAFI_RS_NICFI_KEY: ${{ secrets.CAFI_NICFI_KEY }}
          CAFI_RS_SUPABASE_URL: https://hhdjylwogylmigxxubas.supabase.co
          CAFI_RS_SUPABASE_SERVICE_KEY: ${{ secrets.CAFI_SUPABASE_SERVICE_KEY }}
        run: python -m pes_rs_pipeline.runner
