<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Public GIS portal of the CAFI Payments for Environmental Services (PES) programme in the Congo Basin." />
    <link rel="icon" type="image/png" href="branding/cafi-logo.png" />
    <title>PES GIS Portal</title>
  </head>
  <body>
    <calcite-shell id="app">
      <!-- ============================== header ============================== -->
      <calcite-navigation slot="header">
        <calcite-navigation-logo
          slot="logo"
          thumbnail="branding/cafi-logo.png"
          data-i18n-attr="heading:app.title;description:app.subtitle"
          href="#/map"
        ></calcite-navigation-logo>
        <calcite-menu slot="content-end" id="nav" layout="horizontal">
          <calcite-menu-item data-page="map" href="#/map" icon-start="map" data-i18n-attr="text:nav.map"></calcite-menu-item>
          <calcite-menu-item data-page="analyses" href="#/analyses" icon-start="graph-bar" data-i18n-attr="text:nav.analyses"></calcite-menu-item>
          <calcite-menu-item data-page="alerts" href="#/alerts" icon-start="exclamation-mark-triangle" data-i18n-attr="text:nav.alerts"></calcite-menu-item>
        </calcite-menu>
        <calcite-segmented-control slot="content-end" id="lang" scale="s" appearance="outline-fill">
          <calcite-segmented-control-item value="en">EN</calcite-segmented-control-item>
          <calcite-segmented-control-item value="fr">FR</calcite-segmented-control-item>
        </calcite-segmented-control>
        <img slot="content-end" class="undp-logo" src="branding/undp-logo.svg" alt="UNDP" />
      </calcite-navigation>

      <!-- ============================== MAP page ============================== -->
      <section class="page" data-page="map" id="page-map">
        <calcite-shell>
          <calcite-shell-panel slot="panel-start" position="start" width="m" id="map-panel" display-mode="dock" resizable>
            <calcite-action-bar slot="action-bar" id="map-actions">
              <calcite-action data-panel="filters" icon="filter" active data-i18n-attr="text:panel.filters"></calcite-action>
              <calcite-action data-panel="layers" icon="layers" data-i18n-attr="text:panel.layers"></calcite-action>
              <calcite-action data-panel="legend" icon="legend" data-i18n-attr="text:panel.legend"></calcite-action>
              <calcite-action data-panel="info" icon="information" data-i18n-attr="text:panel.info"></calcite-action>
              <calcite-action data-panel="basemap" icon="basemap" data-i18n-attr="text:panel.basemap"></calcite-action>
            </calcite-action-bar>

            <calcite-panel data-panel="filters" data-i18n-attr="heading:panel.filters">
              <div class="panel-body">
                <div id="filter-fields"></div>
                <calcite-label>
                  <span data-i18n="filter.code"></span>
                  <calcite-input id="flt-code" scale="s" clearable data-i18n-attr="placeholder:filter.codePlaceholder"></calcite-input>
                </calcite-label>
                <calcite-label>
                  <span data-i18n="filter.period"></span>
                  <div class="date-row">
                    <calcite-input-date-picker id="flt-from" scale="s" overlay-positioning="fixed"></calcite-input-date-picker>
                    <calcite-input-date-picker id="flt-to" scale="s" overlay-positioning="fixed"></calcite-input-date-picker>
                  </div>
                </calcite-label>
                <div class="button-row">
                  <calcite-button id="flt-apply" icon-start="check" width="full" data-i18n="filter.apply"></calcite-button>
                  <calcite-button id="flt-reset" appearance="outline" icon-start="reset" data-i18n="filter.reset"></calcite-button>
                </div>
                <p id="filter-status" class="muted"></p>
                <p id="filter-count" class="count"></p>
              </div>
            </calcite-panel>

            <calcite-panel data-panel="layers" hidden data-i18n-attr="heading:panel.layers">
              <arcgis-layer-list reference-element="map-view" show-collapse-button visibility-appearance="checkbox"></arcgis-layer-list>
            </calcite-panel>

            <calcite-panel data-panel="legend" hidden data-i18n-attr="heading:panel.legend">
              <arcgis-legend reference-element="map-view" hide-layers-not-in-current-view respect-layer-definition-expression></arcgis-legend>
            </calcite-panel>

            <calcite-panel data-panel="info" hidden data-i18n-attr="heading:panel.info">
              <p id="info-empty" class="panel-body muted" data-i18n="info.empty"></p>
              <arcgis-feature id="feature-info" reference-element="map-view"></arcgis-feature>
            </calcite-panel>

            <calcite-panel data-panel="basemap" hidden data-i18n-attr="heading:panel.basemap">
              <div class="panel-body">
                <calcite-segmented-control id="basemap-select" layout="vertical" width="full"></calcite-segmented-control>
              </div>
            </calcite-panel>
          </calcite-shell-panel>

          <arcgis-map id="map-view" popup-disabled>
            <arcgis-zoom slot="top-left"></arcgis-zoom>
            <arcgis-home slot="top-left"></arcgis-home>
            <arcgis-scale-bar slot="bottom-left" unit="metric"></arcgis-scale-bar>
          </arcgis-map>
          <calcite-notice id="map-error" kind="danger" icon="exclamation-mark-triangle" closable class="floating-notice">
            <div slot="message" data-i18n="map.loadError"></div>
          </calcite-notice>
        </calcite-shell>
      </section>

      <!-- ============================== ANALYSES page ============================== -->
      <section class="page" data-page="analyses" id="page-analyses" hidden>
        <calcite-shell>
          <calcite-shell-panel slot="panel-start" position="start" width="l" display-mode="dock" resizable>
            <calcite-panel data-i18n-attr="heading:analyses.heading">
              <div class="panel-body">
                <calcite-block expanded data-i18n-attr="heading:analyses.select">
                  <calcite-label>
                    <span data-i18n="analyses.organisation"></span>
                    <calcite-combobox id="an-org" selection-mode="single" scale="s" overlay-positioning="fixed" data-i18n-attr="placeholder:filter.any"></calcite-combobox>
                  </calcite-label>
                  <calcite-label>
                    <span data-i18n="analyses.project"></span>
                    <calcite-combobox id="an-project" selection-mode="single" scale="s" overlay-positioning="fixed" data-i18n-attr="placeholder:filter.any"></calcite-combobox>
                  </calcite-label>
                  <calcite-label>
                    <span data-i18n="analyses.contract"></span>
                    <calcite-combobox id="an-contract" selection-mode="single" scale="s" overlay-positioning="fixed"></calcite-combobox>
                  </calcite-label>
                </calcite-block>

                <calcite-notice id="an-empty" open icon="information" kind="brand">
                  <div slot="message" data-i18n="analyses.empty"></div>
                </calcite-notice>

                <div id="an-results" hidden>
                  <p id="an-status" class="muted"></p>
                  <calcite-notice id="an-nodata" icon="information" kind="warning">
                    <div slot="message" data-i18n="analyses.noData"></div>
                  </calcite-notice>

                  <div id="an-stats" class="stat-row">
                    <div class="stat-tile">
                      <div class="stat-label" data-i18n="analyses.treeCover"></div>
                      <div class="stat-value" id="stat-tc-value"></div>
                      <div class="stat-note" id="stat-tc-note"></div>
                    </div>
                    <div class="stat-tile">
                      <div class="stat-label" data-i18n="analyses.treeCover"></div>
                      <div class="stat-value" id="stat-share-value"></div>
                      <div class="stat-note" id="stat-share-note"></div>
                    </div>
                    <div class="stat-tile">
                      <div class="stat-label" data-i18n="analyses.treeCoverLoss"></div>
                      <div class="stat-value" id="stat-loss-value"></div>
                      <div class="stat-note" id="stat-loss-note"></div>
                    </div>
                  </div>

                  <div id="an-charts">
                    <calcite-block expanded data-i18n-attr="heading:analyses.chartTreeCover">
                      <div class="chart-box"><canvas id="chart-tc" role="img" aria-describedby="an-table"></canvas></div>
                      <p class="source" data-i18n="analyses.source"></p>
                    </calcite-block>
                    <calcite-block expanded data-i18n-attr="heading:analyses.chartLoss">
                      <div class="chart-box"><canvas id="chart-loss" role="img" aria-describedby="an-table"></canvas></div>
                      <p class="source" data-i18n="analyses.source"></p>
                    </calcite-block>
                    <calcite-block collapsible data-i18n-attr="heading:analyses.table">
                      <table id="an-table" class="data-table">
                        <thead>
                          <tr>
                            <th data-i18n="analyses.year"></th>
                            <th data-i18n="analyses.treeCover"></th>
                            <th data-i18n="analyses.treeCoverLoss"></th>
                          </tr>
                        </thead>
                        <tbody></tbody>
                      </table>
                    </calcite-block>
                  </div>

                  <calcite-block expanded data-i18n-attr="heading:analyses.description">
                    <p id="an-description"></p>
                  </calcite-block>
                  <calcite-block collapsible data-i18n-attr="heading:analyses.comingSoon">
                    <p class="muted" data-i18n="analyses.comingSoonList"></p>
                  </calcite-block>
                </div>
              </div>
            </calcite-panel>
          </calcite-shell-panel>

          <arcgis-map id="analyses-map" popup-disabled>
            <arcgis-zoom slot="top-left"></arcgis-zoom>
            <arcgis-home slot="top-left"></arcgis-home>
            <arcgis-scale-bar slot="bottom-left" unit="metric"></arcgis-scale-bar>
          </arcgis-map>
        </calcite-shell>
      </section>

      <!-- ============================== ALERTS page ============================== -->
      <section class="page" data-page="alerts" id="page-alerts" hidden>
        <div class="centered">
          <calcite-notice open icon="exclamation-mark-triangle" kind="warning" scale="l">
            <div slot="title" data-i18n="alerts.heading"></div>
            <div slot="message" data-i18n="alerts.text"></div>
          </calcite-notice>
          <p class="muted big" data-i18n="alerts.soon"></p>
        </div>
      </section>

      <!-- ============================== footer ============================== -->
      <footer slot="footer" class="app-footer">
        <span data-i18n="footer.data"></span>
        <span class="spacer"></span>
        <calcite-link id="link-survey" target="_blank" rel="noopener">Survey123</calcite-link>
        <span><span data-i18n="footer.version"></span> <span id="app-version"></span></span>
      </footer>
    </calcite-shell>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
