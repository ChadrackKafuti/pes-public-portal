# Fly.io app for the CAFI RS Platform API (the single data door).
# Deployed by .github/workflows/deploy-api.yml (or `fly deploy` from this dir).
# The deploy-api workflow creates the app if missing and stages the
# CAFI_DATABASE_URL secret from the GitHub DATABASE_URL secret — no local
# CLI needed. Non-secret runtime config lives in [env] below; while no
# auth provider is configured the API serves anonymously — keep only
# public governance data in the database until one is.

app = "cafi-rs-api"
primary_region = "cdg"

[env]
  CAFI_SUPABASE_URL = "https://hhdjylwogylmigxxubas.supabase.co"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
