# Fly.io app for the CAFI RS Platform API (the single data door).
# Deployed by .github/workflows/deploy-api.yml (or `fly deploy` from this dir).
# Runtime configuration comes from Fly secrets:
#   fly secrets set CAFI_DATABASE_URL=postgresql://...   (Supabase pooled URL)
#   fly secrets set CAFI_CORS_ORIGINS='["https://<your-app>.vercel.app"]'
#   fly secrets set CAFI_OIDC_ISSUER=https://keycloak.cafi-pse.org/realms/UNPES
# While CAFI_OIDC_ISSUER is unset the API serves anonymously — keep only
# public governance data in the database until it is configured.

app = "cafi-rs-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
