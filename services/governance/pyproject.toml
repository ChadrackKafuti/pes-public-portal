[project]
name = "cafi-governance-ingest"
version = "0.0.0"
description = "Congo Basin forest-governance ingest: the cb_forest_ingest ArcGIS Pro workflow ported to a Postgres-backed service (concessions, community forests, protected areas, local territories, zoning, documents)."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
